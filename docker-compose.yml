# Produktion (ZimaOS). Nur instantflat ist nach außen erreichbar.
services:
  fredy:
    image: ghcr.io/orangecoding/fredy:30.1.2 # gepinnt; Updates bewusst anheben
    restart: unless-stopped
    volumes:
      - /DATA/AppData/instantflat/fredy/conf:/conf
      - /DATA/AppData/instantflat/fredy/db:/db
    expose: ["9998"] # nur intern; UI bei Bedarf per SSH-Tunnel
    networks: [internal]

  instantflat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - /DATA/AppData/instantflat/data:/data
    depends_on: [fredy, browser]
    networks: [internal]

  # Optional (docker compose --profile llm up -d): lokales Modell Ternary-Bonsai-8B, ~2,2 GB Download beim ersten Start.
  # Dazu in .env: LLM_PROVIDER=local
  llm:
    build: ./llm
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      LLM_THREADS: "4"
    volumes:
      - /DATA/AppData/instantflat/models:/models
    mem_limit: 4g
    networks: [internal]

  browser:
    build: ./browser
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 1536m
    volumes:
      - /DATA/AppData/instantflat/browser-profile:/profile
    expose: ["6080", "9223"] # nur intern; Zugriff über /browser der App
    networks: [internal]

networks:
  internal: {}
