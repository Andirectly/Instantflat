# Entwicklung (WSL2/Docker Desktop): docker compose -f docker-compose.dev.yml up
services:
  fredy:
    image: ghcr.io/orangecoding/fredy:30.1.2
    ports: ["9998:9998"] # nur lokal, zum Einrichten der Suchen
    volumes:
      - fredy_conf:/conf
      - fredy_db:/db

  instantflat:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      BROWSER_CDP_URL: http://browser:9223
      BROWSER_VNC_URL: http://browser:6080
      MOCK_PORTAL_URL: http://mock-portal:4000
    ports: ["8080:8080", "5173:5173"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  browser:
    build: ./browser
    shm_size: 1gb
    ports: ["9223:9223", "6080:6080"] # nur dev: CDP und noVNC lokal
    volumes:
      - browser_profile:/profile

  mock-portal:
    build: ./mock-portal
    ports: ["4000:4000"]

volumes:
  browser_profile: {}
  fredy_conf: {}
  fredy_db: {}
  node_modules: {}
