name: Docker-Images

# Baut bei jedem Push auf main die Multi-Arch-Images (amd64 + arm64) und veröffentlicht sie in der GitHub Container Registry.
# Das lokale Modell (llm) ist bewusst nur manuell: der Build kompiliert llama.cpp und dauert lange.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "deploy/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      llm:
        description: "Auch das llm-Image bauen (nur amd64)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: instantflat
            context: .
          - name: instantflat-browser
            context: browser
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name (Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  llm:
    if: github.event_name == 'workflow_dispatch' && inputs.llm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name (Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/instantflat-llm" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: llm
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest
